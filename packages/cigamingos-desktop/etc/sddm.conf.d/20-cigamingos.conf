# CiGaming OS login screen (shipped by cigamingos-desktop).
#
# Wayland login: the login screen runs on KWin, the same engine as the
# Plasma (Wayland) session. The older X11 login can fail in virtual machines
# ("no screens found") and is the source of most login-screen trouble.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
Numlock=on

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

# Debian's Breeze login theme, with the CiGaming logo and Cub Moon background
# from cigamingos-branding's theme.conf.user.
[Theme]
Current=debian-breeze
CursorTheme=breeze_cursors
