# CiGaming OS: VMware mouse fix for X11 sessions (GNOME on Xorg, Plasma X11).
#
# On VMware (Workstation and ESXi) the virtual GPU's hardware cursor can
# leave the mouse frozen in X11 sessions. Draw the cursor in software
# instead. MatchDriver means this only ever applies to VMware's vmwgfx
# graphics driver; real hardware never matches it.
Section "OutputClass"
    Identifier "CiGaming OS VMware software cursor"
    MatchDriver "vmwgfx"
    Option "SWcursor" "on"
EndSection
